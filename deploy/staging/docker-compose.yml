services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${STAGING_DB_DATABASE}
      POSTGRES_USER: ${STAGING_DB_USERNAME}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - staging-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - staging-redis:/data

  minio:
    image: cgr.dev/chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${STAGING_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STAGING_MINIO_SECRET_KEY}
    volumes:
      - staging-minio:/data

  minio-init:
    image: staging-app:latest
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
    depends_on:
      minio:
        condition: service_started
    env_file: ${STAGING_ENV_FILE:-.env.staging.local}
    command: php deploy/staging/ensure-bucket.php

  clamav:
    image: clamav/clamav:1.4
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  migrate:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
    command: php artisan migrate --force
    env_file: ${STAGING_ENV_FILE:-.env.staging.local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  app:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
    env_file: ${STAGING_ENV_FILE:-.env.staging.local}
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: deploy/staging/Caddy.Dockerfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - staging-caddy-data:/data
      - staging-caddy-config:/config
    depends_on:
      app:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
    command: php artisan queue:work redis --sleep=1 --tries=1 --timeout=120
    env_file: ${STAGING_ENV_FILE:-.env.staging.local}
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

  scheduler:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
    command: php artisan schedule:work
    env_file: ${STAGING_ENV_FILE:-.env.staging.local}
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

volumes:
  staging-postgres:
  staging-redis:
  staging-minio:
  staging-caddy-data:
  staging-caddy-config:
